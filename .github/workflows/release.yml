name: Plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    if: github.event.deleted == false
    uses: ./.github/workflows/ci.yml
  publish:
    name: Build and publish plugin ZIPs
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ZIP_DIR: dist/plugin-zips
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and validate ZIPs
        run: python -B scripts/build-plugin-zips.py "$ZIP_DIR"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" "$ZIP_DIR"/*.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false
