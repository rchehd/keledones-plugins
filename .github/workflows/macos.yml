name: macOS regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    name: Tests / ${{ matrix.platform.name }} / Python ${{ matrix.python }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: macOS Intel, runner: macos-15-intel}
          - {name: macOS Apple Silicon, runner: macos-15}
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, simplexml, tokenizer
          coverage: none
      - name: Validate and test Ready Check
        working-directory: plugins/ready-check
        run: |
          python -B scripts/ready-check.py validate-package
          python -B -m unittest discover -s tests -v
      - name: Validate and test Gnothi
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        working-directory: plugins/gnothi
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -B scripts/validate-package.py
          python -B -m unittest discover -s tests -v
