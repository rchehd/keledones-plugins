<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'">
<title>$case · Attempt $attempt · QA recording</title>
<style>
  :root { font: 16px/1.5 system-ui, sans-serif; color: #172d3a; background: #f2f7f8; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(1180px, 100%); margin: auto; padding: clamp(18px, 4vw, 44px); }
  h1 { margin: 0 0 20px; font-size: clamp(24px, 4vw, 34px); }
  h2, p { margin: 0; }
  h2 { font-size: 1rem; overflow-wrap: anywhere; }
  p { color: #405763; margin-top: 4px; overflow-wrap: anywhere; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; }
  video { display: block; width: 100%; max-height: 72vh; background: #102936; border-radius: 12px; }
  nav { display: flex; gap: 16px; margin-top: 12px; }
  a { color: #116675; text-underline-offset: 3px; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li { display: flex; gap: 12px; align-items: start; padding: 14px; background: white; border: 1px solid #dce8ec; border-radius: 10px; }
  li > div { min-width: 0; }
  li h2, li p { white-space: pre-wrap; }
  .actor { display: block; font-size: .8rem; color: #526b77; }
  button { padding: 4px 9px; border: 1px solid #cbe0e5; border-radius: 6px; color: #116675; background: #eef7f8;
           font: 600 .9rem/1.6 system-ui, sans-serif; font-variant-numeric: tabular-nums; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  :focus-visible { outline: 2px solid #116675; outline-offset: 3px; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
</style>
<main>
  <h1>$case · Attempt $attempt</h1>
  <div class="layout">
    <div>
      <video controls preload="metadata" src="$video"></video>
      <nav aria-label="Evidence files"><a href="$video">Open video file</a><a href="$journal">Action journal</a></nav>
    </div>
    <ol aria-label="Executed QA steps for attempt $attempt">$steps</ol>
  </div>
</main>
<script>
  const player = document.querySelector("video");
  const steps = document.querySelectorAll("button[data-at]");
  function checkOffsets() {
    for (const step of steps) {
      const outsideRecording = Number.isFinite(player.duration) && Number(step.dataset.at) >= player.duration;
      step.disabled = outsideRecording;
      if (outsideRecording) step.title = "Timestamp is outside the recording";
    }
  }
  player.addEventListener("loadedmetadata", checkOffsets);
  checkOffsets();
  for (const step of steps) {
    step.addEventListener("click", () => {
      const seek = () => {
        checkOffsets();
        if (step.disabled) return;
        player.currentTime = Number(step.dataset.at);
        player.play().catch(() => {});
      };
      if (player.readyState >= 1) seek();
      else player.addEventListener("loadedmetadata", seek, {once: true});
    });
  }
</script>
</html>
