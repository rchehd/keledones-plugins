# The plugin keeps its own hand-written layout, so `ruff format` is not applied.
line-length = 120
target-version = "py39"

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# Scripts set sys.dont_write_bytecode or sys.path before their local imports.
"scripts/**" = ["E402"]
"profiles/**" = ["E402"]

[format]
exclude = ["*"]
